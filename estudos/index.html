<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo à AFA — Estudos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--card:#0d0d0f;--line:#1c1c20;--txt:#f2f2f2;--mut:#7a7a85;--acc:#3b82f6;--ok:#22c55e;--bad:#ef4444;--gold:#facc15}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:28px 24px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;letter-spacing:.5px}.brand span{color:var(--acc)}
.stats{display:flex;gap:18px;font-weight:600;font-size:14px}.stats .m{color:var(--mut);font-weight:400}
.banner{border-radius:24px;padding:32px 36px;background:linear-gradient(90deg,#1e3a8a,#0b0b10);border:1px solid #2b3a67;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.banner .k{font-size:13px;font-weight:700;color:#93c5fd;letter-spacing:.5px}
.banner h1{font-size:44px;font-weight:800;margin:8px 0}
.banner .s{color:#c7d2fe;font-size:16px}
.pr{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:13px;font-weight:600;color:#c7d2fe}
.track{height:10px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;width:260px;max-width:50vw}
.track i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.btn{padding:17px 34px;border:none;border-radius:16px;font-weight:800;font-size:15px;cursor:pointer;background:var(--acc);color:#fff;box-shadow:0 5px 0 #1e40af;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1e40af}
.btn:disabled{background:#1c1c20;color:#4a4a52;box-shadow:none;cursor:default}
.btn.sec{background:#16161a;box-shadow:0 5px 0 #0a0a0c;color:var(--txt)}
h3.sec{font-size:18px;margin:30px 0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.card.click{cursor:pointer;transition:border-color .15s,transform .1s}.card.click:hover{border-color:#33333b}.card.click:active{transform:scale(.98)}
.i{vertical-align:-.15em;flex:none}
.ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.card h4{font-size:20px;margin-bottom:6px}.card .d{color:var(--mut);font-size:13px;margin-bottom:12px}
.mini{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.mini i{display:block;height:100%;border-radius:4px}
.pct{color:var(--mut);font-size:12px;font-weight:600;margin-top:10px}
.card h5{font-size:16px;margin-bottom:14px}
.wk{display:flex;gap:14px;align-items:center;font-size:15px;margin:9px 0}.wk b{font-size:12px;width:30px;color:var(--mut)}
.wk.today b{color:var(--acc)}.wk.today span{font-weight:700}.wk .t{color:var(--acc);font-size:13px;font-weight:600}
.big{font-size:40px;font-weight:800}
.chk{display:flex;gap:10px;align-items:center;margin:9px 0;font-size:15px;cursor:pointer;user-select:none}
.chk i{width:18px;height:18px;border:2px solid #44444c;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.chk.on i{background:var(--ok);border-color:var(--ok);color:#000}.chk.on{color:var(--mut);text-decoration:line-through}
.back{background:none;border:none;color:var(--mut);font-size:15px;font-weight:600;cursor:pointer;margin-bottom:16px}
.unit{margin:26px auto 8px;max-width:560px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.unit h2{font-size:16px}.unit p{color:var(--mut);font-size:13px;margin-top:4px}
.unit button{margin-top:10px;background:none;border:1px solid var(--line);color:var(--txt);padding:7px 12px;border-radius:10px;font-weight:600;font-size:12px;cursor:pointer}
.path{display:flex;flex-direction:column;align-items:center;gap:34px;padding:16px 0 26px}
.node{width:72px;height:72px;border-radius:50%;border:none;font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.node.done{background:var(--gold);color:#000;box-shadow:0 5px 0 #a16207}
.node.low{background:#f97316;color:#000;box-shadow:0 5px 0 #9a3412}
.node.open{background:var(--acc);color:#fff;box-shadow:0 5px 0 #1e40af;animation:pulse 1.6s infinite}
.node.lock{background:#141418;color:#3a3a42;box-shadow:0 5px 0 #0a0a0c;cursor:default}
.node small{position:absolute;top:84px;font-weight:600;font-size:12px;color:var(--mut);white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 5px 0 #1e40af,0 0 0 9px rgba(59,130,246,.15)}}
.note{color:var(--mut);font-size:13px;text-align:center;margin-top:6px}
.screen{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 20px 14px;max-width:640px;width:100%;margin:0 auto}
.x{background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer}
.bar{flex:1;height:12px;background:#16161a;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s;border-radius:8px}
.cnt{color:var(--mut);font-weight:600;font-size:14px}
.body{flex:1;max-width:640px;width:100%;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;overflow:auto}
.label{color:var(--mut);font-size:13px;font-weight:600;margin-bottom:10px}
.q{font-size:32px;font-weight:800;margin:8px 0 18px;line-height:1.3}
.q.t{font-size:21px;font-weight:700}
.ans{font-size:30px;font-weight:800;min-height:62px;border:2px solid var(--line);border-radius:14px;padding:12px 16px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pad button{padding:16px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:700;font-size:20px;cursor:pointer}
.pad button:active{background:#18181d}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:16px;font-weight:600;cursor:pointer}
.opt.sel{border-color:var(--acc);background:#0d1a33}
.opt.right{border-color:var(--ok);background:#052e16}.opt.wrong{border-color:var(--bad);background:#2a0a0a}
.hint{background:none;border:none;color:var(--acc);font-weight:600;font-size:14px;cursor:pointer;margin-top:14px;align-self:flex-start}
.hintbox{margin-top:14px;padding:12px 14px;border-radius:12px;background:#0d1a33;color:#c7d2fe;font-size:14px;line-height:1.5}
.foot{padding:16px 22px calc(16px + env(safe-area-inset-bottom));width:100%}
.foot>div{max-width:640px;margin:0 auto}
.foot.ok{background:#052e16}.foot.bad{background:#2a0a0a}
.msg{font-weight:700;margin-bottom:10px;font-size:16px}.msg span{display:block;font-weight:400;font-size:14px;color:#d6d6dc;margin-top:6px;line-height:1.5}
.foot .btn{width:100%}
.foot.ok .btn{background:var(--ok);box-shadow:0 5px 0 #15803d}.foot.bad .btn{background:var(--bad);box-shadow:0 5px 0 #991b1b}
.teoria{font-size:16px;line-height:1.65;color:#d6d6dc}.teoria b{color:#fff}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-family:ui-monospace,monospace;white-space:pre;overflow:auto;color:#fff;font-size:15px}
.res{text-align:center;padding-top:10px}
.res .nota{font-size:84px;font-weight:800;line-height:1}
.res p{color:var(--mut);margin-top:8px}
.err{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;font-size:14px;line-height:1.55}
.err b{font-size:16px;display:block;margin-bottom:6px}.err .y{color:var(--bad)}.err .c{color:var(--ok)}.err .h{color:#c7d2fe;margin-top:6px}
.rel{margin-top:24px;border:1px solid #2b3a67;background:linear-gradient(90deg,#0d1a33,#0b0b10);border-radius:16px;padding:18px}
.rel b{font-size:16px}.rel p{color:#c7d2fe;font-size:14px;margin:6px 0 14px;line-height:1.5}.rel .btn{width:100%}
.cp{width:100%;height:160px;margin-top:10px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}}
@media(max-width:520px){.wrap{padding:18px 14px 50px}.banner{padding:24px}.banner h1{font-size:34px}.grid4{gap:12px}.card{padding:18px}.card h4{font-size:17px}.banner .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="screen" id="lesson">
  <div class="top"><button class="x" onclick="sair()">✕</button><div class="bar"><i id="prog"></i></div><span class="cnt" id="cnt"></span></div>
  <div class="body" id="lbody"></div>
  <div class="foot" id="lfoot"><div><div class="msg" id="lmsg"></div><button class="btn" id="lbtn">VERIFICAR</button></div></div>
</div>

<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const br=n=>String(n).replace(".",",").replace("-","−");
function rom(n){const t=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let s="";for(const[v,l]of t)while(n>=v){s+=l;n-=v}return s}
// gerador numérico: {q,a,h,frac?} · banco: {q,o:[...],c,h}
const N=(q,a,h,frac)=>({q,a,h,frac});

const MAT={nome:"Matemática",ic:"<svg class='i' width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 20V4l16 16z'/><path d='M8 16v-4l4 4z'/></svg>",cor:"#3b82f6",desc:"Do básico ao avançado",units:[
{t:"Soma",teo:`<b>Somar</b> é juntar. 3 + 4 = 7.<br><br>Com número grande, soma por <b>partes</b> ou faz a <b>conta armada</b>: começa pela unidade (direita). Se passar de 9, escreve só o último dígito e <b>"vai 1"</b>.<div class="ex">   ¹
   2 7
 + 1 5
 -----
   4 2   (7+5=12 → fica 2, vai 1)</div>`,
L:[["1 dígito",()=>{let a=R(1,9),b=R(1,9);return N(`${a} + ${b}`,a+b,"Conta nos dedos se precisar, sem vergonha.")}],
["2 dígitos",()=>{let a=R(10,40),b=R(10,40);while(a%10+b%10>9)b=R(10,40);return N(`${a} + ${b}`,a+b,"Soma dezena com dezena e unidade com unidade.")}],
["vai 1",()=>{let a=R(15,79),b=R(15,79);return N(`${a} + ${b}`,a+b,"Unidade + unidade. Passou de 9? Escreve o último dígito e vai 1.")}],
["3 dígitos",()=>{let a=R(100,599),b=R(100,399);return N(`${a} + ${b}`,a+b,"Centena + centena, dezena + dezena, unidade + unidade, e junta tudo.")}]]},
{t:"Subtração",teo:`<b>Subtrair</b> é tirar. 9 − 4 = 5.<br><br>Na conta armada, se o de cima for menor que o de baixo, <b>pega emprestado</b> 1 da casa da esquerda (vira +10).<div class="ex">   3 ¹2
 − 1  7
 ------
   1  5   (12−7=5, e o 3 virou 2)</div><b>Dica:</b> confere somando. Se 15 + 17 = 32, tá certo.`,
L:[["1 dígito",()=>{let a=R(5,18),b=R(1,Math.min(9,a));return N(`${a} − ${b}`,a-b,"Pensa: quanto falta do menor pro maior?")}],
["2 dígitos",()=>{let a=R(30,99),b=R(10,a);while(b%10>a%10)b=R(10,a);return N(`${a} − ${b}`,a-b,"Dezena menos dezena, unidade menos unidade.")}],
["empréstimo",()=>{let a=R(30,99),b=R(11,a-1);return N(`${a} − ${b}`,a-b,"Se a unidade de cima for menor, pega 1 dezena emprestada (+10).")}],
["3 dígitos",()=>{let a=R(300,999),b=R(100,a-50);return N(`${a} − ${b}`,a-b,"Faz por partes ou armada. Confere somando no final.")}]]},
{t:"Tabuada",teo:`<b>Multiplicar</b> é somar várias vezes o mesmo número.<br>4 × 3 = 3 + 3 + 3 + 3 = 12.<br><br>Imagina <b>4 caixas com 3 folhas cada</b> = 12 folhas.<div class="ex">×2 → dobro
×5 → metade do ×10
×9 → ×10 menos o número
     (9×7 = 70−7 = 63)</div>`,
L:[["×2 a ×5",()=>{let a=R(2,5),b=R(1,10);return N(`${a} × ${b}`,a*b,`Soma ${b} repetido ${a} vezes.`)}],
["×6 a ×9",()=>{let a=R(6,9),b=R(1,10);return N(`${a} × ${b}`,a*b,"×9 = ×10 menos o número. ×6 = ×5 mais uma vez.")}],
["misturado",()=>{let a=R(2,9),b=R(2,9);return N(`${a} × ${b}`,a*b,"Se travar, inverte: 7×3 é igual a 3×7.")}]]},
{t:"Multiplicação",teo:`Pra multiplicar número grande, <b>quebra em partes</b>:<div class="ex">36 × 7
= 30×7 + 6×7
= 210 + 42
= 252</div><b>Truque do zero:</b> 30 × 7 = 3 × 7 com um zero no fim.`,
L:[["×10 e ×100",()=>{let a=R(2,99),b=pick([10,100]);return N(`${a} × ${b}`,a*b,"×10 coloca um zero no final. ×100, dois zeros.")}],
["dezena × 1 dígito",()=>{let a=R(2,9)*10,b=R(2,9);return N(`${a} × ${b}`,a*b,"Faz sem o zero e coloca o zero no fim.")}],
["2 dígitos × 1",()=>{let a=R(12,59),b=R(2,9);return N(`${a} × ${b}`,a*b,`Quebra: ${Math.floor(a/10)*10}×${b} + ${a%10}×${b}.`)}]]},
{t:"Divisão",teo:`<b>Dividir</b> é repartir igual. 12 ÷ 3 = 4 (12 balas pra 3 pessoas).<br><br>É a <b>tabuada ao contrário</b>: 12 ÷ 3 → "3 vezes quanto dá 12?"<div class="ex">56 ÷ 7 → 7 × ? = 56 → 8</div>`,
L:[["tabuada ao contrário",()=>{let b=R(2,9),q=R(1,10);return N(`${b*q} ÷ ${b}`,q,`Pensa: ${b} vezes quanto dá ${b*q}?`)}],
["números maiores",()=>{let b=R(2,9),q=R(11,30);return N(`${b*q} ÷ ${b}`,q,"Tira um pedaço fácil primeiro (10 × o divisor) e divide o resto.")}]]},
{t:"Números romanos",teo:`São letras que valem números:<div class="ex">I = 1    V = 5    X = 10
L = 50   C = 100  D = 500
M = 1000</div><b>Regras:</b><br>• Letra igual ou menor <b>depois</b> → soma: VI = 5+1 = 6, XII = 12<br>• Letra menor <b>antes</b> → subtrai: IV = 5−1 = 4, IX = 9, XL = 40<br>• Repete no máximo 3 vezes: III = 3, XXX = 30`,
L:[["I, V, X (1 a 10)",()=>{let n=R(1,10);return N(`Quanto vale ${rom(n)}?`,n,"I=1, V=5, X=10. Menor antes subtrai, depois soma.")}],
["até 50",()=>{let n=R(11,50);return N(`Quanto vale ${rom(n)}?`,n,"Lê da esquerda pra direita: X=10, L=50. XL = 40.")}],
["escrever em romano",()=>{let n=R(1,40),o=shuf([...new Set([rom(n),rom(Math.max(1,n-1)),rom(n+1),rom(n+5)])]);return{q:`Como se escreve ${n} em romano?`,o,c:o.indexOf(rom(n)),h:"Monta das maiores pras menores: dezenas (X) primeiro, depois as unidades."}}],
["até 3000",()=>{let n=pick([R(51,199),R(200,999),R(1000,2026)]);return N(`Quanto vale ${rom(n)}?`,n,"C=100, D=500, M=1000. Separa por blocos: milhar, centena, dezena, unidade.")}]]},
{t:"Expressões",teo:`Quando tem várias contas juntas, a ordem é:<div class="ex">1º  ( ) parênteses
2º  × e ÷
3º  + e −</div>12 + 8 × 3 → 8×3 = 24 → 12 + 24 = <b>36</b><br>(12 + 8) × 3 → 20 × 3 = <b>60</b>`,
L:[["× antes do +",()=>{let a=R(2,20),b=R(2,9),c=R(2,9);return pick([N(`${a} + ${b} × ${c}`,a+b*c,"Faz a multiplicação primeiro, depois a soma."),N(`${a+b*c} − ${b} × ${c}`,a,"Multiplicação antes da subtração.")])}],
["parênteses",()=>{let a=R(2,15),b=R(2,15),c=R(2,6);return N(`(${a} + ${b}) × ${c}`,(a+b)*c,"Resolve o que tá dentro do parêntese primeiro.")}]]},
{t:"Negativos",teo:`Pensa num <b>termômetro</b>: abaixo de 0 são os negativos.<br><br>3 − 5 = <b>−2</b><br>−4 + 6 = <b>2</b><br><br><b>Regra dos sinais</b> (× e ÷):<div class="ex">+ com + = +
− com − = +
+ com − = −</div>Use o botão <b>−</b> do teclado.`,
L:[["soma e subtração",()=>{let a=R(-10,10),b=R(-10,10);return N(`${br(a)} ${b<0?"−":"+"} ${Math.abs(b)}`,a+b,"Anda no termômetro: + sobe, − desce.")}],
["regra dos sinais",()=>{let a=R(-9,9)||2,b=R(-9,9)||3;return N(`(${br(a)}) × (${br(b)})`,a*b,"Sinais iguais dá +, diferentes dá −.")}]]},
{t:"Frações",teo:`<b>3/4</b> = dividiu em 4 pedaços e pegou 3.<br><br>Mesmo denominador? Soma só em cima:<div class="ex">1/5 + 2/5 = 3/5</div>Fração de um número:<div class="ex">3/4 de 20 → 20 ÷ 4 = 5 → 5 × 3 = 15</div>Use o botão <b>/</b> pra responder fração.`,
L:[["mesmo denominador",()=>{let d=R(3,12),a=R(1,d-2),b=R(1,d-a-1);return N(`${a}/${d} + ${b}/${d}`,(a+b)/d,"Soma só os de cima e repete o de baixo.",1)}],
["fração de um número",()=>{let d=pick([2,3,4,5,10]),n=R(1,d-1),k=R(2,12);return N(`${n}/${d} de ${d*k}`,n*k,`Divide ${d*k} por ${d} e multiplica por ${n}.`)}],
["simplificar",()=>{let a=R(1,5),b=R(a+1,9);while(gcd(a,b)!=1)b++;let k=R(2,6);return N(`Simplifique ${a*k}/${b*k}`,a/b,`Divide em cima e embaixo pelo mesmo número (${k}).`,1)}]]},
{t:"Decimais",teo:`Dinheiro é decimal: R$ 2,50.<br><br>Pra somar, <b>alinha a vírgula</b>:<div class="ex">  2,50
+ 1,75
------
  4,25</div>×10 anda a vírgula 1 casa pra direita. ÷10, pra esquerda.`,
L:[["soma",()=>{let a=R(10,99)/10,b=R(10,99)/10;return N(`${br(a)} + ${br(b)}`,+(a+b).toFixed(2),"Alinha a vírgula e soma igual número inteiro.")}],
["×10 e ÷10",()=>{let a=R(11,99)/10;return pick([N(`${br(a)} × 10`,+(a*10).toFixed(2),"×10: vírgula anda 1 casa pra direita."),N(`${br(a)} ÷ 10`,+(a/10).toFixed(3),"÷10: vírgula anda 1 casa pra esquerda.")])}]]},
{t:"Porcentagem",teo:`<b>%</b> = "de cada 100".<div class="ex">10% de 80 = 80 ÷ 10 = 8
50% = metade
25% = metade da metade
20% = 2 × (10%)</div>`,
L:[["10%, 50%, 25%",()=>{let p=pick([10,50,25]),v=R(1,20)*20;return N(`${p}% de ${v}`,v*p/100,p==10?"Divide por 10.":p==50?"É a metade.":"Metade da metade.")}],
["qualquer %",()=>{let p=pick([5,15,20,30,40,60,75]),v=R(1,10)*20;return N(`${p}% de ${v}`,v*p/100,"Acha 10% primeiro (÷10) e monta a partir dele.")}]]},
{t:"Potências e raízes",teo:`<b>2³</b> = 2 × 2 × 2 = 8<div class="ex">5² = 25    10³ = 1000
qualquer número⁰ = 1
√49 = 7   (porque 7² = 49)</div>`,
L:[["quadrados",()=>{let a=R(1,12);return N(`${a}²`,a*a,`${a} × ${a}`)}],

  <div class="grid3">
   <div class="card"><h5>Plano da semana</h5>${[1,2,3,4,5].map(i=>`<div class="wk ${i==d.getDay()?"today":""}"><b>${DIAS[i]}</b><span>${SUBJ[ROT[i]].nome}</span>${i==d.getDay()?'<span class="t">• hoje</span>':""}</div>`).join("")}<div class="wk"><b>FDS</b><span style="color:var(--mut)">Revisão livre</span></div></div>
   <div class="card"><h5>Seu progresso</h5><div class="big">${S.wkxp} XP</div><div class="d" style="color:var(--mut);margin:6px 0 12px">Meta da semana: 300 XP</div><div class="mini" style="height:10px"><i style="width:${Math.min(100,S.wkxp/3)}%;background:var(--gold)"></i></div><div style="color:var(--gold);font-weight:600;font-size:14px;margin-top:14px">${S.streak?`<svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3c1 3 4 4.5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-8z'/></svg> ${S.streak} dia(s) seguidos — não quebra a sequência!`:"Faz uma lição hoje pra começar a sequência <svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3c1 3 4 4.5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-8z'/></svg>"}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn sec" style="padding:12px 16px;font-size:13px" onclick="mapa('${k}')">Lições de ${s.nome}</button><button class="btn sec" style="padding:12px 16px;font-size:13px" onclick="caderno()"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='5' y='3' width='14' height='18' rx='2'/><path d='M9 3v18M12 8h4M12 12h4'/></svg> Caderno de erros (${S.caderno.length})</button></div></div>
   <div class="card"><h5>Treino físico de hoje</h5>${TREINO.map((t,i)=>`<div class="chk ${tr.includes(i)?"on":""}" onclick="treino(${i})"><i>${tr.includes(i)?"✓":""}</i>${t}</div>`).join("")}<div style="color:var(--ok);font-weight:600;font-size:13px;margin-top:12px">Meta do TAF: 1850 m em 12 min</div></div>
  </div>`;
}
function treino(i){const h=hoje(),t=S.treino[h]||[];S.treino={[h]:t.includes(i)?t.filter(x=>x!=i):[...t,i]};save();home()}

// ---- mapa da matéria ----
function mapa(k){
  window.scrollTo(0,0);
  const s=SUBJ[k];let h=`<button class="back" onclick="home()">← Voltar</button><header style="margin-bottom:0"><div style="display:flex;align-items:center;gap:12px"><div class="ic" style="background:${s.cor}26;margin:0">${s.ic}</div><div><div style="font-size:26px;font-weight:800">${s.nome}</div><div style="color:var(--mut);font-size:14px">${pct(k)}% concluído</div></div></div></header><div class="note">Tire nota 6 ou mais pra destravar a próxima lição.</div>`,lib=true;
  s.units.forEach((u,ui)=>{
    h+=`<div class="unit"><h2>Unidade ${ui+1} · ${u.t}</h2><button onclick="teoria('${k}',${ui})"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z'/><path d='M12 6v14'/></svg> Ver explicação</button></div><div class="path">`;
    u.L.forEach((l,li)=>{
      const n=S.notas[key(k,ui,li)],ok=n>=6,cls=ok?"done":n!=null&&lib?"low":lib?"open":"lock";
      h+=`<button class="node ${cls}" style="transform:translateX(${[0,50,0,-50][li%4]}px)" ${cls=="lock"?"":`onclick="abrir('${k}',${ui},${li})"`}>${n!=null?fmtNota(n):cls=="lock"?"<svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='5' y='11' width='14' height='10' rx='2'/><path d='M8 11V8a4 4 0 0 1 8 0v3'/></svg>":li+1}<small>${l[0]}</small></button>`;
      if(!ok)lib=false;
    });h+=`</div>`;
  });
  document.getElementById("app").innerHTML=h;
  const o=document.querySelector(".node.open,.node.low");if(o)o.scrollIntoView({block:"center"});
}

// ---- lição ----
const scr=document.getElementById("lesson"),BD=document.getElementById("lbody"),F=document.getElementById("lfoot"),M=document.getElementById("lmsg"),BT=document.getElementById("lbtn");
let L={};
function teoria(k,ui,depois){
  scr.classList.add("on");document.getElementById("prog").style.width="0";document.getElementById("cnt").textContent="";
  const u=SUBJ[k].units[ui];
  BD.innerHTML=`<div class="label">${SUBJ[k].nome.toUpperCase()} · UNIDADE ${ui+1}</div><div class="q t" style="font-size:26px;font-weight:800">${u.t}</div><div class="teoria">${u.teo}</div>`;
  F.className="foot";M.innerHTML="";BT.disabled=false;BT.textContent=depois?"BORA PRATICAR":"ENTENDI";
  BT.onclick=()=>depois?depois():sair();
}
function abrir(k,ui,li){
  const src=SUBJ[k].units[ui].L[li][1];
  let qs;
  if(typeof src=="function"){qs=[];let tries=0;while(qs.length<10&&tries<200){tries++;const x=src();if(!qs.some(y=>y.q==x.q)||tries>60)qs.push(x)}}
  else qs=shuf(src).slice(0,10).map(x=>{const o=shuf(x.o.map((t,i)=>[t,i==x.c]));return{q:x.q,o:o.map(v=>v[0]),c:o.findIndex(v=>v[1]),h:x.h}});
  L={k,ui,li,qs,i:0,certos:0,erros:[]};
  const primeira=li==0&&S.notas[key(k,ui,0)]==null;
  if(primeira)teoria(k,ui,prox);else{scr.classList.add("on");prox()}
}
function prox(){
  if(L.i>=L.qs.length)return fim();
  const c=L.cur=L.qs[L.i];L.val="";L.sel=null;L.dica=false;
  document.getElementById("prog").style.width=(L.i/L.qs.length*100)+"%";
  document.getElementById("cnt").textContent=`${L.i+1}/${L.qs.length}`;
  let h;
  if(c.o){
    h=`<div class="label">ESCOLHA A RESPOSTA</div><div class="q t">${c.q}</div><div class="opts">${c.o.map((t,i)=>`<button class="opt" data-i="${i}" onclick="sel(${i})">${t}</button>`).join("")}</div>`;
  }else{
    const keys=["7","8","9","⌫","4","5","6","−","1","2","3",",","0"].concat(c.frac?["/"]:[]);
    const sinal=/[=?]|Simplifique|Área|Perímetro/.test(c.q)?"":" =";
    h=`<div class="label">RESOLVA</div><div class="q ${c.q.length>22?"t":""}">${c.q}${sinal}</div><div class="ans" id="ans">&nbsp;</div><div class="pad">${keys.map(x=>`<button onclick="tecla('${x}')">${x}</button>`).join("")}</div>`;
  }
  BD.innerHTML=h+`<button class="hint" id="hb" onclick="dica()"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z'/></svg> Ver dica</button>`;
  F.className="foot";M.innerHTML="";BT.textContent="VERIFICAR";BT.disabled=true;BT.onclick=verificar;
}
function dica(){L.dica=true;document.getElementById("hb").outerHTML=`<div class="hintbox"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z'/></svg> ${L.cur.h}</div>`}
function sel(i){if(F.className!="foot")return;L.sel=i;document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.i==i));BT.disabled=false}
function tecla(x){
  if(F.className!="foot")return;
  if(x=="⌫")L.val=L.val.slice(0,-1);else if(L.val.length<9)L.val+=x;
  document.getElementById("ans").innerHTML=L.val||"&nbsp;";BT.disabled=!L.val;
}
document.addEventListener("keydown",e=>{
  if(!scr.classList.contains("on"))return;
  if(e.key=="Enter"){if(!BT.disabled)BT.click();return}
  if(L.cur&&L.cur.o&&/^[1-9]$/.test(e.key)&&+e.key<=L.cur.o.length){sel(+e.key-1);return}
  if(!document.getElementById("ans"))return;
  const m={"Backspace":"⌫","-":"−",".":",",",":",","/":"/"};
  if(/^[0-9]$/.test(e.key))tecla(e.key);else if(m[e.key])tecla(m[e.key]);
});
function num(s){s=s.replace("−","-").replace(",",".");if(s.includes("/")){const[a,b]=s.split("/").map(Number);return b?a/b:NaN}return s===""?NaN:Number(s)}
function fmt(c){const v=c.a;if(c.frac&&!Number.isInteger(v)){for(let d=2;d<=144;d++){const n=v*d;if(Math.abs(n-Math.round(n))<1e-9)return Math.round(n)+"/"+d}}return br(+v.toFixed(3))}
function verificar(){
  const c=L.cur;let ok,sua,certa;
  if(c.o){ok=L.sel==c.c;sua=c.o[L.sel];certa=c.o[c.c];
    document.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;if(i==c.c)b.classList.add("right");else if(i==L.sel)b.classList.add("wrong")});}
  else{ok=Math.abs(num(L.val)-c.a)<1e-9;sua=L.val;certa=fmt(c)}
  if(ok){L.certos++;F.className="foot ok";M.innerHTML=pick(["Boa! <svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3c1 3 4 4.5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-8z'/></svg>","Mandou bem!","Isso aí!","Certinho!","Tá voando <svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15 13 10V4.5a1.5 1.5 0 0 0-3 0V10l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-4.5l8 2.5z'/></svg>"]);}
  else{L.erros.push({q:c.q,sua,certa,h:c.h});F.className="foot bad";M.innerHTML=`Resposta certa: ${certa}<span><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z'/></svg> ${c.h}</span>`;}
  L.i++;document.getElementById("prog").style.width=(L.i/L.qs.length*100)+"%";
  const hb=document.getElementById("hb");if(hb)hb.remove();
  BT.disabled=false;BT.textContent="CONTINUAR";BT.onclick=prox;
}
function fim(){
  const nota=L.certos/L.qs.length*10,k=key(L.k,L.ui,L.li),antes=S.notas[k];
  S.notas[k]=Math.max(antes??0,nota);
  const ganho=L.certos+(nota>=6?10:0);S.xp+=ganho;S.wkxp+=ganho;
  const h=hoje();if(S.last!=h){const y=new Date(Date.now()-864e5).toLocaleDateString("pt-BR");S.streak=S.last==y?S.streak+1:1;S.last=h}
  const nomeL=`${SUBJ[L.k].nome} › ${SUBJ[L.k].units[L.ui].t} › ${SUBJ[L.k].units[L.ui].L[L.li][0]}`;
  L.erros.forEach(e=>S.caderno.unshift({d:h,l:nomeL,...e}));S.caderno=S.caderno.slice(0,80);
  save();
  L.prompt=promptLicao(nomeL,nota,L.certos,L.qs.length,L.erros);
  const cor=nota>=8?"var(--ok)":nota>=6?"var(--gold)":"var(--bad)";
  const frase=nota==10?"Perfeito! Gabaritou <svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4v4h-4z'/></svg>":nota>=8?"Muito bem, mandou bem demais!":nota>=6?"Passou! Dá pra melhorar ainda mais.":"Ainda não foi dessa vez. Revê os erros e tenta de novo, você já sabe mais que antes.";
  document.getElementById("cnt").textContent="";
  BD.innerHTML=`<div class="res"><div class="label">SUA NOTA</div><div class="nota" style="color:${cor}">${fmtNota(nota)}</div><p>${L.certos} de ${L.qs.length} certas · +${ganho} XP</p><p style="color:var(--txt);margin-top:12px">${frase}</p>${nota>=6?"":`<p>Precisa de 6 pra destravar a próxima lição.</p>`}</div>
  ${L.erros.length?`<h3 class="sec" style="margin-top:26px">O que você errou</h3>`+L.erros.map(e=>`<div class="err"><b>${e.q}</b><div class="y">Você respondeu: ${e.sua}</div><div class="c">Certo: ${e.certa}</div><div class="h"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z'/></svg> ${e.h}</div></div>`).join(""):""}`;
  BD.innerHTML+=`<div class="rel"><b><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 5h16v11H9l-5 4z'/><path d='M8 10h.01M12 10h.01M16 10h.01'/></svg> Relatório da lição</b><p>Copia o relatório com a sua nota e tudo que você errou, pra revisar ou mandar pra quem te ajuda a estudar.</p><button class="btn" onclick="copiar(L.prompt,this)"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='6' y='4' width='12' height='17' rx='2'/><path d='M9 4V3h6v1M9 10h6M9 14h6M9 18h3'/></svg> COPIAR RELATÓRIO</button></div>`;
  F.className="foot";M.innerHTML=`<div style="display:flex;gap:10px"><button class="btn sec" style="flex:1" onclick="abrir('${L.k}',${L.ui},${L.li})">REFAZER</button></div>`;
  BT.disabled=false;BT.textContent="CONTINUAR";BT.onclick=()=>{scr.classList.remove("on");mapa(L.k)};
}
function promptLicao(nome,nota,c,t,erros){
  let s=`Relatório de lição — Rumo à AFA\n\nLição: ${nome}\nNota: ${fmtNota(nota)} (${c} de ${t} certas)\n`;
  if(!erros.length)return s+`\nAcertei tudo! Me passa 5 exercícios um pouco mais difíceis desse mesmo assunto pra eu treinar (sem as respostas).`;
  s+=`\nO que eu errei:\n`+erros.map((e,i)=>`${i+1}. ${e.q}\n   Eu respondi: ${e.sua}\n   Certo: ${e.certa}`).join("\n");
  return s+`\n\nMe explica por que eu errei cada uma, passo a passo e de um jeito simples, mostrando onde meu raciocínio provavelmente se perdeu. Depois me passa 3 exercícios parecidos pra treinar (sem as respostas, eu te mando pra corrigir).`;
}
function promptGeral(){
  const lin=Object.keys(SUBJ).map(k=>`- ${SUBJ[k].nome}: ${pct(k)}% concluído`).join("\n");
  const notas=Object.entries(S.notas).filter(([,n])=>n<6).map(([k,n])=>{const[m,r]=k.split(":"),[u,l]=r.split("-").map(Number),s=SUBJ[m];return s&&s.units[u]?`- ${s.nome} › ${s.units[u].t} › ${s.units[u].L[l][0]}: nota ${fmtNota(n)}`:""}).filter(Boolean).join("\n");
  const er=S.caderno.slice(0,15).map((e,i)=>`${i+1}. [${e.l}] ${e.q} → respondi ${e.sua}, certo ${e.certa}`).join("\n");
  return `Relatório geral — Rumo à AFA\n\nSequência: ${S.streak} dia(s) · XP total: ${S.xp} · XP da semana: ${S.wkxp}/300\n\nProgresso:\n${lin}\n\nLições com nota abaixo de 6:\n${notas||"- nenhuma"}\n\nMeus erros mais recentes:\n${er||"- nenhum ainda"}\n\nAnalisa meus erros e me diz quais são meus pontos fracos, o que eu devo revisar primeiro e me monta um mini treino de 10 questões focado neles (sem respostas).`;
}
function copiar(txt,b){
  const ok=()=>{const o=b.innerHTML;b.textContent="COPIADO!";setTimeout(()=>b.innerHTML=o,2500)};
  const manual=()=>{const t=document.createElement("textarea");t.value=txt;t.readOnly=true;t.className="cp";b.after(t);t.focus();t.select();b.textContent="Selecione o texto abaixo e copie"};
  try{navigator.clipboard.writeText(txt).then(ok,manual)}catch(e){manual()}
}
function caderno(){
  window.scrollTo(0,0);
  const c=S.caderno;
  document.getElementById("app").innerHTML=`<button class="back" onclick="home()">← Voltar</button>
  <div style="font-size:26px;font-weight:800"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='5' y='3' width='14' height='18' rx='2'/><path d='M9 3v18M12 8h4M12 12h4'/></svg> Caderno de erros</div><div style="color:var(--mut);font-size:14px;margin:6px 0 18px">Tudo que você errou fica aqui pra revisar. Os erros de hoje são os acertos de amanhã.</div>
  <div class="rel" style="margin-top:0"><b><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 5h16v11H9l-5 4z'/><path d='M8 10h.01M12 10h.01M16 10h.01'/></svg> Relatório completo</b><p>Junta seu progresso, as notas baixas e os últimos erros num texto só, pronto pra copiar.</p><button class="btn" onclick="copiar(promptGeral(),this)"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='6' y='4' width='12' height='17' rx='2'/><path d='M9 4V3h6v1M9 10h6M9 14h6M9 18h3'/></svg> COPIAR RELATÓRIO GERAL</button></div>
  ${c.length?c.map(e=>`<div class="err"><div style="color:var(--mut);font-size:12px;margin-bottom:4px">${e.d} · ${e.l}</div><b>${e.q}</b><div class="y">Você respondeu: ${e.sua}</div><div class="c">Certo: ${e.certa}</div><div class="h"><svg class='i' width='1em' height='1em' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z'/></svg> ${e.h}</div></div>`).join("")+`<button class="btn sec" style="margin-top:20px" onclick="limpar(this)">Limpar caderno</button>`:`<div class="err" style="text-align:center;color:var(--mut)">Nenhum erro ainda. Bora fazer uma lição!</div>`}`;
}
function limpar(b){if(b.dataset.c){S.caderno=[];save();caderno()}else{b.dataset.c=1;b.textContent="Toque de novo pra confirmar"}}
function sair(){scr.classList.remove("on");if(L.k&&document.querySelector(".path"))mapa(L.k);else home()}
home();
</script>
</body>
</html>
